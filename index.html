<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Creme's Kitchen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hud" hidden>
    <header class="step">
      <span id="step-count" class="step-count">Step 3 of 6</span>
      <h2 id="step-title">Crack the eggs</h2>
      <div id="pips" class="pips" aria-hidden="true"></div>
    </header>
    <div class="foot">
      <p id="hint" class="hint">Pick up an egg and knock it on the edge of the bowl</p>
      <button id="again" class="btn" hidden>Again</button>
    </div>
  </div>

  <button id="mute" class="icon-btn" aria-label="Mute sound" aria-pressed="false" hidden>🔊</button>

  <div id="title" class="title-card">
    <div class="logo" aria-hidden="true">🍰</div>
    <h1>Creme's<br>Kitchen</h1>
    <p class="made-for">made for Creme</p>
    <button id="start" class="btn btn-big">Let's bake!</button>
    <p id="loading" class="loading">warming up the oven…</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
