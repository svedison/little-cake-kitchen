<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Creme's Kitchen</title>
  <meta name="theme-color" content="#fff6e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Creme's Kitchen">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Fredoka (SIL OFL, public/fonts/OFL.txt) is self-hosted: the kitchen opens offline and never waits on a font CDN. -->
  <link rel="preload" href="/fonts/fredoka-400.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hud" hidden>
    <header id="step-head" class="step" hidden>
      <span id="step-count" class="step-count"></span>
      <h2 id="step-title"></h2>
      <div id="pips" class="pips" aria-hidden="true" hidden></div>
      <svg id="ring" class="ring" viewBox="0 0 120 120" aria-hidden="true" hidden>
        <circle class="track" cx="60" cy="60" r="50"/>
        <circle class="sweet" cx="60" cy="60" r="50"/>
        <circle class="arc" cx="60" cy="60" r="50"/>
        <!-- The arcs start at 12 o'clock because the whole svg is rotated. The heart sits on the
             sweet wedge itself (placed by Hud.setRing) and swells while the arc is in it. -->
        <g class="ring-heart"><path d="M0 5.5C-7.5 0-7 -6.5-3.4 -6.5-1.6 -6.5-0.4 -5.4 0 -4.2 0.4 -5.4 1.6 -6.5 3.4 -6.5 7 -6.5 7.5 0 0 5.5Z"/></g>
      </svg>
      <!-- The bake gauge: bands, labels and the goal ring are filled in by Hud.bakeGauge. -->
      <div id="bake" class="bake" aria-hidden="true" hidden></div>
    </header>
    <div class="foot">
      <div id="tag" class="tag" hidden></div>
      <div id="verdict" class="tag verdict" hidden></div>
      <p id="hint" class="hint"></p>
      <div id="buttons" class="row"></div>
    </div>
  </div>

  <div id="bubble" class="bubble" hidden></div>

  <button id="mute" class="icon-btn" aria-label="Mute sound" aria-pressed="false" hidden>🔊</button>

  <div id="book" class="overlay" hidden>
    <div class="card">
      <h2>Basque Cheesecake</h2>
      <p class="muted">Creamy inside, burnt on top. In the oven, hold until the top is BURNT: that's the Basque way! Pick a flavour:</p>
      <div id="book-flavors" class="chips"></div>
      <button id="book-bake" class="btn btn-big">Bake!</button>
      <button id="book-close" class="btn btn-ghost btn-small">Not now</button>
    </div>
  </div>

  <div id="lightbox" class="overlay" hidden>
    <div class="card">
      <img id="lightbox-img" class="lightbox-img" alt="" hidden>
      <h3 id="lightbox-title"></h3>
      <p id="lightbox-date" class="muted"></p>
      <p>Chef cat says: <span id="lightbox-verdict" class="pill"></span></p>
      <button id="lightbox-close" class="btn btn-small">Close</button>
    </div>
  </div>

  <div id="more" class="overlay" hidden>
    <div class="card">
      <h3>Older cakes</h3>
      <ol id="more-list" class="more-list"></ol>
      <button id="more-close" class="btn btn-small">Close</button>
    </div>
  </div>

  <!-- Swipe hints at the screen edges, until the first swipe between Stations. -->
  <div id="chevrons" class="chevrons" aria-hidden="true" hidden>
    <svg class="chev chev-l" viewBox="0 0 24 40"><path d="M17 6 L5 20 L17 34"/></svg>
    <svg class="chev chev-r" viewBox="0 0 24 40"><path d="M7 6 L19 20 L7 34"/></svg>
  </div>

  <button id="lost" class="lost" hidden>The kitchen fell asleep. Tap to reload</button>

  <div id="title" class="title-card">
    <img class="logo" src="/icons/icon.svg" alt="" width="112" height="112">
    <h1>Creme's<br>Kitchen</h1>
    <p class="made-for">made for Creme</p>
    <button id="start" class="btn btn-big" disabled>Let's bake!</button>
    <p id="loading" class="loading">warming up the oven…</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
